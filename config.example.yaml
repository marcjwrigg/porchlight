# Porchlight — your launcher, in one file.
#
# THE EDITOR REWRITES THIS FILE, AND COMMENTS DO NOT SURVIVE A SAVE. Anything
# you want to remember about an entry goes in its `note:`, which is data, does
# round-trip, and shows as the tile's tooltip.
#
# Copy this to config.yaml and edit it, or just start the server and use the
# browser editor — the gear icon, top right.

settings:
  # Blank for no heading. The browser tab uses this too.
  title: ''
  # An image URL, or a filename you uploaded (served from bg/). Blank for none.
  background: ''
  favicon: ''

  # Defaults for a browser that has not set its own. Each visitor's own choice
  # is kept in localStorage and is never overridden by these.
  layout: flat        # flat | grouped
  sort: az            # az | curated  (curated = the order in this file)
  # The heading's own controls appear only when `title` above is set.
  titleAlign: left    # left | center | right
  titleSize: 21       # heading size in px
  size: m             # s | m | l
  gapX: 8             # px between tiles
  gapY: 8
  padX: 32            # px of page margin
  padY: 28
  bgDim: 72           # 0 = background at full strength, 100 = hidden

groups:
- name: Media
  services:
  - name: Jellyfin
    href: http://192.168.1.10:8096
    icon: jellyfin
  - name: Sonarr
    href: http://192.168.1.10:8989
    icon: sonarr
  - name: Radarr
    href: http://192.168.1.10:7878
    icon: radarr

- name: Infrastructure
  services:
  - name: Proxmox
    href: https://192.168.1.2:8006
    icon: proxmox
  - name: AdGuard Home
    href: http://192.168.1.3:3000
    icon: adguard-home
    note: Two DNS servers, two tiles — when one is broken you want to reach that one.
  - name: Uptime Kuma
    href: http://192.168.1.10:3001
    icon: uptime-kuma

- name: Anything else
  services:
  - name: My Router
    href: http://192.168.1.1
    # No icon: renders a lettered tile. That is a finished state, not a to-do.
