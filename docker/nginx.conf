server {
    listen 80 default_server;
    server_name _;
    root /srv/public;
    index index.html;

    # Compression matters most over a tunnel or a slow link, where round trips
    # dominate. SVG marks compress hard.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # Caching is per-location on purpose. A single server-level `no-store`
    # applied to every asset too, so a browser re-fetched every icon — and a
    # 24 MB background — on each visit. Invisible on a LAN; through a tunnel it
    # is the whole page load.
    #
    # nginx does NOT merge add_header across levels: a location that declares
    # one discards every inherited one. Each location therefore sets its own.

    # Regenerated wholesale on every save, so it must never be cached — a stale
    # grid looks exactly like an edit that did nothing.
    location = / {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Backgrounds are content-hashed on upload (stem-<sha256>.jpg), so a
    # different image is a different filename. Safe to pin, and much the
    # largest thing on the page.
    location /bg/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Logos are content-hashed on upload like backgrounds, so pin them too.
    location /logo/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Icons are named by slug, so --refresh can replace one in place.
    # Revalidate daily rather than pinning for a year.
    location /icons/ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Changes only when porchlight itself is upgraded.
    location = /catalog.json {
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    # The write path. The API binds loopback, so this proxy is the only way in.
    # There is no authentication beyond that — do not put this on the internet
    # without auth in front of it.
    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        # Above the API's own per-kind caps, so an oversized upload is refused
        # by the API with a readable JSON reason rather than by nginx with an
        # HTML page the editor cannot parse.
        client_max_body_size 32m;
    }

    access_log off;
}
