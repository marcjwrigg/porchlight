server {
    listen 80 default_server;
    server_name _;
    root /srv/public;
    index index.html;
    add_header Cache-Control "no-store" always;
    location / { try_files $uri $uri/ =404; }
    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        client_max_body_size 32m;
    }
    access_log off;
}
